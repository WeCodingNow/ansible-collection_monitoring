---
- name: fetch the grafana tarball into the control-node cache
  ansible.builtin.import_tasks: fetch.yml
  tags:
    - download
    - grafana

- name: install grafana from the cached tarball
  ansible.builtin.import_tasks: install.yml
  tags:
    - download
    - grafana

- name: create the grafana system user
  become: true
  ansible.builtin.user:
    name: grafana
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/grafana
    create_home: false
  tags:
    - grafana

- name: create grafana's runtime directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"
  loop:
    - /etc/grafana/provisioning/dashboards
    - /etc/grafana/provisioning/datasources
    - /var/lib/grafana
    - /var/lib/grafana/plugins
    - /var/log/grafana
  tags:
    - grafana

- name: provision dashboards
  ansible.builtin.import_tasks: dashboards.yml
  tags:
    - grafana
    - grafana-dashboards

- name: provision datasources
  ansible.builtin.import_tasks: datasources.yml
  tags:
    - grafana
    - grafana-dashboards

- name: render grafana.ini
  become: true
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: /etc/grafana/grafana.ini
    owner: grafana
    group: grafana
    mode: "0640"
  notify: restart grafana
  tags:
    - grafana
    - monitoring-config

- name: install the grafana systemd unit
  become: true
  ansible.builtin.template:
    src: grafana.service.j2
    dest: /etc/systemd/system/grafana.service
    mode: "0644"
  notify: restart grafana
  tags:
    - grafana

- name: ensure grafana is running and enabled
  become: true
  ansible.builtin.systemd:
    name: grafana
    state: started
    enabled: true
    daemon_reload: true
  tags:
    - grafana
