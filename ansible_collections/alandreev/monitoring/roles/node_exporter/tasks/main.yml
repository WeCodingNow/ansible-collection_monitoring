---
- name: install node_exporter
  ansible.builtin.import_role:
    name: alandreev.monitoring.common
    tasks_from: install_release.yml
  vars:
    common_release_name: node_exporter
    common_release_version: "{{ monitoring_node_exporter_version }}"
    common_release_url: "{{ node_exporter_release_url }}"
    common_release_checksum_url: "{{ node_exporter_checksum_url }}"
    common_release_cache: "{{ node_exporter_release_cache }}"
    common_release_archive_root: "{{ node_exporter_archive_root }}"
    common_release_binaries: [node_exporter]
  tags:
    - download
    - node_exporter

- name: create the node_exporter system user
  become: true
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/node_exporter
    create_home: false
  tags:
    - node_exporter

- name: install the node_exporter systemd unit
  become: true
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
  notify: restart node_exporter
  tags:
    - node_exporter

- name: ensure node_exporter is running and enabled
  become: true
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true
  tags:
    - node_exporter
