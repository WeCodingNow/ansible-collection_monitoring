---
node_exporter_archive_root: "node_exporter-{{ monitoring_node_exporter_version }}.linux-amd64"
node_exporter_release_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ monitoring_node_exporter_version }}/node_exporter-{{ monitoring_node_exporter_version }}.linux-amd64.tar.gz"
node_exporter_checksum_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ monitoring_node_exporter_version }}/sha256sums.txt"
node_exporter_release_cache: "{{ monitoring_cache_dir }}/node_exporter"

node_exporter_args: >-
  {{
    ['--web.listen-address=' ~ monitoring_node_exporter_listen_address]
    + (monitoring_node_exporter_collectors_enabled | map('regex_replace', '^', '--collector.') | list)
    + (monitoring_node_exporter_collectors_disabled | map('regex_replace', '^', '--no-collector.') | list)
    + monitoring_node_exporter_extra_args
  }}
